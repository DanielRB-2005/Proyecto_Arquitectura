<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>

    <style>
        body {
            background-color: yellow;
            color: black;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        button {
            background-color: white;
            color: black;
            border: 2px solid black;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: orange;
        }
    </style>
</head>

<body>

    <!-- PAGINA PRINCIPAL -->
    <section id="inicio">
        <h1>Mi Página Web</h1>

        <h2>Botones</h2>

        <button onclick="mostrarPagina('inicio')">
            Reporte
        </button>

        <button onclick="mostrarPagina('servicios')">
            Codigo
        </button>

        <button onclick="mostrarPagina('contacto')">
            Integrantes
        </button>

        <h2>Reporte</h2>

        <p>
         Reporte
            ou she ous he
            AGREGAR LINK DEL REPORTE
        </p>
    </section>

    <!-- PAGINA DE SERVICIOS -->
    <section id="servicios" style="display:none;">

        <h1>Codigo</h1>

        <p>
            EL CODIGO
            AGREGAR
            PREGUNTAR SI AGREGAR ENLACE O INCLUIR CODIGO EN 
            GIT AQUICON ESTE SIONO
        </p>

        <button onclick="mostrarPagina('inicio')">
            Regresar al menú
        </button>

    </section>

    <!-- PAGINA DE CONTACTO -->
    <section id="contacto" style="display:none;">

        <h1>Integrantes</h1>

        <p>OUSHESHIEHSIHSHIEHIE</p>
        <p>PAPSPAPSPASLLFALFLSALASFA</p>

        <button onclick="mostrarPagina('inicio')">
            Regresar al menú
        </button>

    </section>

    <!-- FUNCION PARA CAMBIAR DE PAGINA -->
    <script>

        function mostrarPagina(pagina) {

            document.getElementById('inicio').style.display = 'none';
            document.getElementById('servicios').style.display = 'none';
            document.getElementById('contacto').style.display = 'none';

            document.getElementById(pagina).style.display = 'block';

        }

    </script>

</body>
</html>
